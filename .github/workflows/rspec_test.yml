name: "Ruby on Rails CI"

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # If you use PostgreSQL, uncomment this. If using SQLite, you don't need a service.
      # postgres:
      #   image: postgres:11-alphine
      #   ports: ["5432:5432"]

    env:
      RAILS_ENV: test
      # Add dummy ENV variables so your TaskService/SessionsController specs don't crash
      DEV_EMAIL: ${{ secrets.DEV_EMAIL }}
      DEV_PASSWORD: ${{ secrets.DEV_PASSWORD }}
      DEFAULT_PROJECT_NAME: ${{ secrets.DEFAULT_PROJECT_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up database
        run: |
          bin/rails db:prepare

      - name: Run tests
        run: bundle exec rspec
